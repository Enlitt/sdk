[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enlitt"
version = "0.1.0"
description = "Enlitt SDK for Python: per-user model calls and premium-call accounting for apps whose users bring their own credits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://enlitt.com"
Documentation = "https://enlitt.com/docs/python"
Repository = "https://github.com/enlitt/sdk"
Issues = "https://github.com/enlitt/sdk/issues"

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
starlette = ["starlette>=0.37,<1"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
  "mypy",
  "openai>=1.66,<3",
  "starlette>=0.37,<1",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enlitt"]

[tool.hatch.build.targets.sdist]
include = ["src/enlitt", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
